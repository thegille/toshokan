<!DOCTYPE html>
<html>
<head>
<title>Toshokan</title>
 <link rel="stylesheet" href="css/style.css">
</head>
<body>
     <header>
 <h1>Toshokan</h1>
 <p>Biblioteca Descentralizada</p>
 </header>
 <!-- TARJETA 1 -->
<div class="card">
 <h2>Solicitud de préstamo</h2>
 <input
 id="customer"
 type="text"
 placeholder="Nombre del cliente">
 <input
 id="book"
 type="text"
placeholder="Nombre del libro">
 <label>Fecha de préstamo</label>
 <input
 id="loanDate"
 type="date">
 <label>Fecha de vencimiento</label>
 <input
 id="dueDate"
 type="date">
 <br><br>
 <button id="walletBtn">
 Conectar Freighter
 </button>
 <br><br>
 <button id="loanBtn">
 Registrar préstamo
 </button>
 </div>
 <!-- TARJETA 2 -->
 <div class="card">
 <h2>Estado actual</h2>
 <p id="wallet">
 Wallet no conectada
 </p>
 <p id="status">
 Sin préstamo activo
 </p>
 <p id="fine">
 Multa: 0 XLM
 </p>
 </div>
 <script type="module" src="js/app.js"></script>
</body>
</html>
